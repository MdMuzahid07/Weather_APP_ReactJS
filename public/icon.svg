<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Glowing Sun Gradient -->
    <radialGradient id="sun-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </radialGradient>

    <!-- Cloud Front Gradient -->
    <linearGradient id="cloud-grad-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Cloud Back Glow Gradient -->
    <linearGradient id="cloud-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Rain Drop Gradient -->
    <linearGradient id="rain-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    
    <filter id="sun-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#F59E0B" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Canvas Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="120" r="140" fill="#38BDF8" opacity="0.15" />
  <circle cx="400" cy="400" r="160" fill="#6366F1" opacity="0.15" />

  <!-- Glowing Sun with Ray Ring -->
  <g filter="url(#sun-glow)">
    <circle cx="340" cy="175" r="70" fill="url(#sun-grad)" />
    <!-- Sun Ray Accents -->
    <line x1="340" y1="75" x2="340" y2="90" stroke="#FDE047" stroke-width="6" stroke-linecap="round" />
    <line x1="440" y1="175" x2="425" y2="175" stroke="#FDE047" stroke-width="6" stroke-linecap="round" />
    <line x1="410" y1="105" x2="399" y2="116" stroke="#FDE047" stroke-width="6" stroke-linecap="round" />
    <line x1="410" y1="245" x2="399" y2="234" stroke="#FDE047" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Back Glow Cloud Layer -->
  <path d="M 180 340 
           A 65 65 0 0 1 230 220 
           A 85 85 0 0 1 370 230 
           A 60 60 0 0 1 410 340 Z" 
        fill="url(#cloud-glow)" />

  <!-- Main Foreground Custom Cloud Art -->
  <g filter="url(#shadow-main)">
    <path d="M 160 360
             C 120 360 90 328 90 285
             C 90 245 118 214 158 210
             C 172 160 218 124 270 124
             C 332 124 382 170 388 230
             C 424 235 450 266 450 302
             C 450 342 418 360 380 360
             Z"
          fill="url(#cloud-grad-front)" />
  </g>

  <!-- Custom Rain Drops Accent -->
  <g opacity="0.9">
    <path d="M 180 390 C 180 390 170 410 170 418 C 170 424 174 428 180 428 C 186 428 190 424 190 418 C 190 410 180 390 180 390 Z" fill="url(#rain-grad)" />
    <path d="M 250 400 C 250 400 240 420 240 428 C 240 434 244 438 250 438 C 256 438 260 434 260 428 C 260 420 250 400 250 400 Z" fill="url(#rain-grad)" />
    <path d="M 320 390 C 320 390 310 410 310 418 C 310 424 314 428 320 428 C 326 428 330 424 330 418 C 330 410 320 390 320 390 Z" fill="url(#rain-grad)" />
  </g>
</svg>
